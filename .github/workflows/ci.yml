name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l ./cmd ./internal)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build Linux targets
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o /tmp/handy-parser-amd64 ./cmd/handy-parser
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o /tmp/handy-parser-arm64 ./cmd/handy-parser
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build container image
        run: docker build --tag handy-parser:ci .
      - name: Smoke test container as runtime user
        shell: bash
        run: |
          set -euo pipefail
          data_dir="$(mktemp -d)"
          sudo chown 10001:10001 "$data_dir"
          docker run --rm \
            --user 10001:10001 \
            --read-only \
            --tmpfs /tmp:size=16m,mode=1777 \
            --volume "$data_dir:/data" \
            --env HANDY_DB_PATH=/data/handy.db \
            handy-parser:ci migrate
          docker run --detach --name handy-parser-ci \
            --user 10001:10001 \
            --read-only \
            --tmpfs /tmp:size=16m,mode=1777 \
            --volume "$data_dir:/data" \
            --memory 96m --memory-swap 96m --cpus 0.50 --pids-limit 64 \
            --env HANDY_DB_PATH=/data/handy.db \
            --env HANDY_LISTEN=0.0.0.0:8080 \
            --env HANDY_ADMIN_PASSWORD=ci-only-password \
            handy-parser:ci serve
          trap 'docker logs handy-parser-ci; docker rm --force handy-parser-ci' EXIT
          for attempt in {1..10}; do
            if docker exec handy-parser-ci /app/handy-parser healthcheck; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Verify release archive
        shell: bash
        run: |
          set -euo pipefail
          output_dir="$(mktemp -d)"
          bash ./scripts/build-release.sh v0.0.0-ci "$output_dir" ghcr.io/expressionist/handy-parser:edge
          (cd "$output_dir" && sha256sum --check handy-parser-v0.0.0-ci.tar.gz.sha256)
          tar -xzf "$output_dir/handy-parser-v0.0.0-ci.tar.gz" -C "$output_dir"
          mkdir -p "$output_dir/handy-parser-v0.0.0-ci/secrets"
          touch "$output_dir/handy-parser-v0.0.0-ci/secrets/admin_password"
          touch "$output_dir/handy-parser-v0.0.0-ci/secrets/telegram_bot_token"
          docker compose -f "$output_dir/handy-parser-v0.0.0-ci/compose.yaml" config --quiet
